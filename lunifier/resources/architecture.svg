<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="screenBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="screenBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="screenBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Channel Badges -->
    <linearGradient id="ch1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ch2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="ch3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Border Zone Glows -->
    <linearGradient id="glowRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="glowLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="glowLeftCh2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="glowRightCh2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="glowLeftCh3" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.45" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="neonGlowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .channel-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; text-transform: uppercase; }
    .trigger-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
    .trigger-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
    .zone-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #cbd5e1; font-weight: 500; }
    .footer-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
  </style>

  <!-- Container Frame -->
  <rect width="960" height="430" rx="16" fill="url(#canvasBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- ===================================================================== -->
  <!-- MONITOR 1: HOST 1 (Channel 1) -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 30)">
    <!-- Monitor Bezel & Stand -->
    <rect x="95" y="270" width="80" height="24" rx="4" fill="#334155" filter="url(#subtleShadow)" />
    <polygon points="120,240 150,240 155,272 115,272" fill="#1e293b" />
    
    <!-- Monitor Outer Body -->
    <rect x="0" y="0" width="270" height="240" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Top Bar -->
    <rect x="2" y="2" width="266" height="38" rx="10" fill="#1e293b" />
    <circle cx="20" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="21" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="21" r="5" fill="#22c55e" opacity="0.8" />
    <text x="66" y="26" class="title">Host 1</text>
    
    <!-- Badge -->
    <rect x="165" y="10" width="92" height="22" rx="11" fill="url(#ch1Grad)" />
    <text x="211" y="25" text-anchor="middle" class="channel-badge">Channel 1</text>

    <!-- Screen Display Area -->
    <rect x="10" y="46" width="250" height="182" rx="6" fill="url(#screenBg1)" stroke="#1e293b" stroke-width="1" />
    
    <!-- Center Content Graphic -->
    <circle cx="100" cy="137" r="32" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5" />
    <path d="M92 127 L108 127 M100 119 L100 135 M94 145 L106 145" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="100" y="143" text-anchor="middle" font-size="16" fill="#38bdf8">💻</text>
    <text x="100" y="180" text-anchor="middle" class="trigger-sub">Primary PC</text>

    <!-- Right Border Dwell Trigger Zone -->
    <rect x="226" y="46" width="34" height="182" rx="0" fill="url(#glowRight)" />
    <line x1="260" y1="46" x2="260" y2="228" stroke="#38bdf8" stroke-width="2.5" />
    <text x="248" y="70" text-anchor="middle" class="zone-label" fill="#38bdf8" transform="rotate(90, 248, 70)">RIGHT BORDER</text>

    <!-- Routing Action Box -->
    <g transform="translate(130, 115)">
      <rect x="0" y="0" width="118" height="46" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleShadow)" />
      <text x="8" y="18" class="trigger-title" fill="#38bdf8">Dwell ➔ Switch</text>
      <text x="8" y="34" class="trigger-sub">Target: <tspan fill="#c084fc" font-weight="700">Channel 2</tspan></text>
      <path d="M88 28 L106 28" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- MONITOR 2: HOST 2 (Channel 2) -->
  <!-- ===================================================================== -->
  <g transform="translate(345, 30)">
    <!-- Monitor Bezel & Stand -->
    <rect x="95" y="270" width="80" height="24" rx="4" fill="#334155" filter="url(#subtleShadow)" />
    <polygon points="120,240 150,240 155,272 115,272" fill="#1e293b" />
    
    <!-- Monitor Outer Body -->
    <rect x="0" y="0" width="270" height="240" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Top Bar -->
    <rect x="2" y="2" width="266" height="38" rx="10" fill="#1e293b" />
    <circle cx="20" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="21" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="21" r="5" fill="#22c55e" opacity="0.8" />
    <text x="66" y="26" class="title">Host 2</text>
    
    <!-- Badge -->
    <rect x="165" y="10" width="92" height="22" rx="11" fill="url(#ch2Grad)" />
    <text x="211" y="25" text-anchor="middle" class="channel-badge">Channel 2</text>

    <!-- Screen Display Area -->
    <rect x="10" y="46" width="250" height="182" rx="6" fill="url(#screenBg2)" stroke="#1e293b" stroke-width="1" />

    <!-- Left Border Dwell Trigger Zone -->
    <rect x="10" y="46" width="34" height="182" rx="0" fill="url(#glowLeftCh2)" />
    <line x1="10" y1="46" x2="10" y2="228" stroke="#a855f7" stroke-width="2.5" />
    <text x="22" y="150" text-anchor="middle" class="zone-label" fill="#c084fc" transform="rotate(-90, 22, 150)">LEFT BORDER</text>

    <!-- Left Routing Box -->
    <g transform="translate(22, 60)">
      <rect x="0" y="0" width="112" height="42" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#a855f7" stroke-width="1.2" filter="url(#subtleShadow)" />
      <text x="22" y="17" class="trigger-title" fill="#c084fc">Left Border</text>
      <text x="22" y="32" class="trigger-sub">➔ <tspan fill="#38bdf8" font-weight="700">Channel 1</tspan></text>
      <path d="M18 24 L6 24" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
    </g>

    <!-- Center Icon -->
    <circle cx="135" cy="137" r="26" fill="#7c3aed" fill-opacity="0.12" stroke="#a855f7" stroke-dasharray="3,3" stroke-width="1.5" />
    <text x="135" y="143" text-anchor="middle" font-size="16" fill="#a855f7">🖥️</text>

    <!-- Right Border Dwell Trigger Zone -->
    <rect x="226" y="46" width="34" height="182" rx="0" fill="url(#glowRightCh2)" />
    <line x1="260" y1="46" x2="260" y2="228" stroke="#a855f7" stroke-width="2.5" />
    <text x="248" y="70" text-anchor="middle" class="zone-label" fill="#c084fc" transform="rotate(90, 248, 70)">RIGHT BORDER</text>

    <!-- Right Routing Box -->
    <g transform="translate(136, 160)">
      <rect x="0" y="0" width="112" height="42" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#a855f7" stroke-width="1.2" filter="url(#subtleShadow)" />
      <text x="8" y="17" class="trigger-title" fill="#c084fc">Right Border</text>
      <text x="8" y="32" class="trigger-sub">➔ <tspan fill="#34d399" font-weight="700">Channel 3</tspan></text>
      <path d="M84 24 L98 24" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- MONITOR 3: HOST 3 (Channel 3) -->
  <!-- ===================================================================== -->
  <g transform="translate(660, 30)">
    <!-- Monitor Bezel & Stand -->
    <rect x="95" y="270" width="80" height="24" rx="4" fill="#334155" filter="url(#subtleShadow)" />
    <polygon points="120,240 150,240 155,272 115,272" fill="#1e293b" />
    
    <!-- Monitor Outer Body -->
    <rect x="0" y="0" width="270" height="240" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Top Bar -->
    <rect x="2" y="2" width="266" height="38" rx="10" fill="#1e293b" />
    <circle cx="20" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="21" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="21" r="5" fill="#22c55e" opacity="0.8" />
    <text x="66" y="26" class="title">Host 3</text>
    
    <!-- Badge -->
    <rect x="165" y="10" width="92" height="22" rx="11" fill="url(#ch3Grad)" />
    <text x="211" y="25" text-anchor="middle" class="channel-badge">Channel 3</text>

    <!-- Screen Display Area -->
    <rect x="10" y="46" width="250" height="182" rx="6" fill="url(#screenBg3)" stroke="#1e293b" stroke-width="1" />

    <!-- Left Border Dwell Trigger Zone -->
    <rect x="10" y="46" width="34" height="182" rx="0" fill="url(#glowLeftCh3)" />
    <line x1="10" y1="46" x2="10" y2="228" stroke="#34d399" stroke-width="2.5" />
    <text x="22" y="150" text-anchor="middle" class="zone-label" fill="#34d399" transform="rotate(-90, 22, 150)">LEFT BORDER</text>

    <!-- Left Routing Action Box -->
    <g transform="translate(22, 115)">
      <rect x="0" y="0" width="118" height="46" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#34d399" stroke-width="1.2" filter="url(#subtleShadow)" />
      <text x="24" y="18" class="trigger-title" fill="#34d399">Dwell ➔ Switch</text>
      <text x="24" y="34" class="trigger-sub">Target: <tspan fill="#c084fc" font-weight="700">Channel 2</tspan></text>
      <path d="M18 28 L4 28" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
    </g>

    <!-- Center Content Graphic -->
    <circle cx="170" cy="137" r="32" fill="#059669" fill-opacity="0.12" stroke="#34d399" stroke-dasharray="3,3" stroke-width="1.5" />
    <text x="170" y="143" text-anchor="middle" font-size="16" fill="#34d399">💻</text>
    <text x="170" y="180" text-anchor="middle" class="trigger-sub">Tertiary PC</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM INFORMATION PANEL -->
  <!-- ===================================================================== -->
  <g transform="translate(30, 335)">
    <rect width="900" height="70" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    
    <!-- Logitech HID++ feature icon badge -->
    <g transform="translate(24, 17)">
      <rect width="36" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="24" text-anchor="middle" font-size="18">⚡</text>
    </g>

    <text x="74" y="31" class="footer-text">
      Simultaneous Logitech Hardware Switching via HID++ 2.0 Feature <tspan fill="#38bdf8" font-family="monospace" font-weight="700">0x1814</tspan> (<tspan fill="#c084fc" font-family="monospace">CHANGE_HOST</tspan>)
    </text>
    <text x="74" y="49" class="footer-sub">
      Seamless cursor flow across MX Master, MX Keys, M720, POP, and Craft over Bluetooth, Logi Bolt, and Unifying receivers.
    </text>

    <!-- Badges on right of panel -->
    <g transform="translate(735, 23)">
      <rect width="145" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="12" r="4" fill="#34d399" />
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="600" fill="#94a3b8">Zero Wi-Fi / LAN Req.</text>
    </g>
  </g>
</svg>
