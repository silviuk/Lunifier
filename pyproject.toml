[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunifier"
version = "2.2.0"
description = "Seamless Logitech Easy-Switch Flow for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Silviu Vlasceanu"}
]
keywords = ["logitech", "easy-switch", "mx-keys", "mx-master", "flow", "bluetooth", "unifying", "bolt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Microsoft Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C#",
    "Topic :: Desktop Environment",
    "Topic :: System :: Hardware"
]
dependencies = [
    "PyGObject>=3.42.0"
]

[project.urls]
Homepage = "https://github.com/silviuk/Lunifier"
Repository = "https://github.com/silviuk/Lunifier.git"
Issues = "https://github.com/silviuk/Lunifier/issues"

[tool.setuptools.packages.find]
where = ["src/linux/lunifier-adwaita"]
include = ["lunifier*"]

[tool.pytest.ini_options]
pythonpath = ["src/linux/lunifier-adwaita"]
testpaths = ["tests"]
