# Proposed one-time workflow for silviuk/Lunifier. NOT installed or executed.
# Encrypts exactly three existing Store credentials for silviuk/Lapdroid.
# After successful import, remove this workflow and its encrypted artifact.
name: Configure Lapdroid publisher secrets once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    if: github.ref == 'refs/heads/master' && github.repository == 'silviuk/Lunifier'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install encryption library
        run: python -m pip install --disable-pip-version-check PyNaCl==1.5.0
      - name: Encrypt three publisher credentials for Lapdroid
        shell: python
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          import os, json, base64
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          key = PublicKey(base64.b64decode('m+qVAsaH+2HVggshxK7pisor+higbwgciPxvMh6IUko='))
          names = ('MS_STORE_TENANT_ID', 'MS_STORE_CLIENT_ID', 'MS_STORE_CLIENT_SECRET')
          if any(not os.environ.get(n) for n in names):
              raise SystemExit('A required publisher secret is missing; no output created.')
          output = {n: {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(SealedBox(key).encrypt(os.environ[n].encode())).decode()} for n in names}
          Path('lapdroid-encrypted-secrets.json').write_text(json.dumps(output))
          print('Three encrypted envelopes created for silviuk/Lapdroid only.')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lapdroid-encrypted-secrets
          path: lapdroid-encrypted-secrets.json
          retention-days: 1
          if-no-files-found: error
