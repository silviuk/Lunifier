name: Publish to Microsoft Store and WinGet

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to publish (e.g. v1.0.6). Leave blank for latest release.'
        required: false
        default: ''
        type: string
      publish_winget:
        description: 'Publish update to WinGet (microsoft/winget-pkgs)'
        required: true
        default: true
        type: boolean
      publish_store:
        description: 'Publish update to Windows Store (Microsoft Partner Center)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 1: Resolve Release Info & Download Assets
      # -----------------------------------------------------------------------
      - name: Resolve Release Information and Assets
        id: release_info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Resolving GitHub Release details..."
          $inputTag = "${{ inputs.release_tag }}".Trim()

          if ([string]::IsNullOrWhiteSpace($inputTag)) {
            Write-Host "No release tag supplied. Querying latest release..."
            $releaseJson = gh release view --json tagName,name,assets
          } else {
            Write-Host "Querying release tag: $inputTag..."
            $releaseJson = gh release view $inputTag --json tagName,name,assets
          }

          $release = $releaseJson | ConvertFrom-Json
          $tag = $release.tagName
          $version = $tag.TrimStart('v')

          Write-Host "Target Release Tag: $tag (Version: $version)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          # Create directory and download all release artifacts
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          gh release download $tag --dir release-assets

          $exeAsset = Get-ChildItem -Path release-assets -Filter "*.exe" | Select-Object -First 1
          $msixAsset = Get-ChildItem -Path release-assets -Filter "*.msix" | Select-Object -First 1

          if ($exeAsset) {
            Write-Host "Found Setup Executable: $($exeAsset.Name)"
            "exe_path=$($exeAsset.FullName)" >> $env:GITHUB_OUTPUT
            "exe_name=$($exeAsset.Name)" >> $env:GITHUB_OUTPUT
            $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exeAsset.Name)"
            "installer_url=$installerUrl" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .exe installer file found in release assets."
          }

          if ($msixAsset) {
            Write-Host "Found MSIX Package: $($msixAsset.Name)"
            "msix_path=$($msixAsset.FullName)" >> $env:GITHUB_OUTPUT
            "msix_name=$($msixAsset.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .msix package file found in release assets."
          }

      # -----------------------------------------------------------------------
      # Step 2: Publish to Windows Package Manager (WinGet)
      # -----------------------------------------------------------------------
      - name: Publish to WinGet
        if: ${{ inputs.publish_winget }}
        id: winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          VERSION: ${{ steps.release_info.outputs.version }}
          INSTALLER_URL: ${{ steps.release_info.outputs.installer_url }}
        run: |
          Write-Host "=========================================================="
          Write-Host "Starting WinGet Publication (Package: silviuk.Lunifier)"
          Write-Host "=========================================================="

          if (-not $env:WINGET_TOKEN) {
            Write-Warning "::warning::WINGET_TOKEN secret is not configured in this repository. Skipping WinGet update. Add a GitHub Personal Access Token (PAT) with 'public_repo' scope to repository secrets as WINGET_TOKEN."
            "winget_status=Skipped (Missing WINGET_TOKEN secret)" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not $env:INSTALLER_URL) {
            Write-Error "Cannot publish to WinGet: No installer executable URL found in release assets."
            "winget_status=Failed (No installer URL)" >> $env:GITHUB_OUTPUT
            exit 1
          }

          Write-Host "Downloading Microsoft Windows Package Manager Manifest Creator (wingetcreate)..."
          $wcUrl = "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe"
          Invoke-WebRequest -Uri $wcUrl -OutFile "wingetcreate.exe"

          Write-Host "Submitting manifest update to microsoft/winget-pkgs..."
          Write-Host "Package ID: silviuk.Lunifier"
          Write-Host "Version:    $env:VERSION"
          Write-Host "URL:        $env:INSTALLER_URL"

          try {
            if (Test-Path "manifests/winget") {
              Write-Host "Using repository manifests in manifests/winget..."
              .\wingetcreate.exe submit --prtitle "Update: silviuk.Lunifier version $env:VERSION" --no-open --token $env:WINGET_TOKEN manifests/winget
            } else {
              .\wingetcreate.exe update --submit --token $env:WINGET_TOKEN --urls $env:INSTALLER_URL --version $env:VERSION silviuk.Lunifier
            }
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Successfully submitted WinGet manifest update PR!"
              "winget_status=Submitted PR successfully via wingetcreate" >> $env:GITHUB_OUTPUT
            } else {
              Write-Warning "wingetcreate exited with code $LASTEXITCODE. If the initial package PR is still open/pending merge in microsoft/winget-pkgs, subsequent updates cannot be submitted until that initial PR is merged."
              "winget_status=Exited with code $LASTEXITCODE (Check PR status)" >> $env:GITHUB_OUTPUT
            }
          } catch {
            Write-Warning "Error during wingetcreate execution: $_"
            "winget_status=Error: $_" >> $env:GITHUB_OUTPUT
          } finally {
            $global:LASTEXITCODE = 0
          }

      # -----------------------------------------------------------------------
      # Step 3: Publish to Windows Store (Microsoft Partner Center)
      # -----------------------------------------------------------------------
      - name: Publish to Microsoft Store
        if: ${{ !cancelled() && inputs.publish_store }}
        id: msstore
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          MSIX_PATH: ${{ steps.release_info.outputs.msix_path }}
          EXE_PATH: ${{ steps.release_info.outputs.exe_path }}
        run: |
          Write-Host "=========================================================="
          Write-Host "Starting Microsoft Store Publication (Lunifier)"
          Write-Host "=========================================================="

          $missingSecrets = @()
          if (-not $env:TENANT_ID) { $missingSecrets += "MS_STORE_TENANT_ID" }
          if (-not $env:SELLER_ID) { $missingSecrets += "MS_STORE_SELLER_ID" }
          if (-not $env:CLIENT_ID) { $missingSecrets += "MS_STORE_CLIENT_ID" }
          if (-not $env:CLIENT_SECRET) { $missingSecrets += "MS_STORE_CLIENT_SECRET" }

          if ($missingSecrets.Count -gt 0) {
            $list = $missingSecrets -join ", "
            Write-Warning "::warning::Microsoft Store credentials are missing ($list). Skipping Windows Store publication."
            "store_status=Skipped (Missing secrets: $list)" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not ($env:MSIX_PATH -and (Test-Path $env:MSIX_PATH))) {
            Write-Error "No .msix package found in release assets for Store submission."
            "store_status=Failed (No MSIX package found)" >> $env:GITHUB_OUTPUT
            exit 1
          }

          Write-Host "Authenticating with Microsoft Partner Center (Entra ID)..."
          $tokenResp = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -ContentType "application/x-www-form-urlencoded" -Body @{
            grant_type    = "client_credentials"
            client_id     = $env:CLIENT_ID
            client_secret = $env:CLIENT_SECRET
            scope         = "https://manage.devcenter.microsoft.com/.default"
          }

          $accessToken = $tokenResp.access_token
          if (-not $accessToken) {
            Write-Error "Failed to obtain access token from Azure Entra ID."
            "store_status=Auth Failed" >> $env:GITHUB_OUTPUT
            exit 1
          }

          $headers = @{
            "Authorization" = "Bearer $accessToken"
            "Content-Type"  = "application/json"
            "Accept"        = "application/json"
          }

          Write-Host "Querying all applications in Partner Center..."
          $appsResp = Invoke-RestMethod -Method Get -Uri "https://manage.devcenter.microsoft.com/v1.0/my/applications" -Headers $headers

          Write-Host "Found $($appsResp.value.Count) applications in Partner Center:"
          foreach ($app in $appsResp.value) {
            Write-Host " - Name: '$($app.primaryName)' | ID: $($app.id) | PackageFamily: $($app.packageFamilyName)"
          }

          $targetAppId = $env:APP_ID
          if (-not $targetAppId) {
            # Prefer app with Lunifier in name
            $match = $appsResp.value | Where-Object { $_.primaryName -like "*Lunifier*" } | Select-Object -First 1
            if (-not $match) {
              # Check for app named 'App' or containing 'App' (excluding Luminark)
              $match = $appsResp.value | Where-Object { ($_.primaryName -eq "App" -or $_.primaryName -like "*App*") -and $_.primaryName -ne "Luminark" } | Select-Object -First 1
            }
            if (-not $match) {
              # Pick any non-Luminark application
              $match = $appsResp.value | Where-Object { $_.primaryName -ne "Luminark" } | Select-Object -First 1
            }
            if ($match) {
              $targetAppId = $match.id
              Write-Host "Selected Target Application: '$($match.primaryName)' (ID: $targetAppId)"
            }
          }

          if (-not $targetAppId) {
            Write-Error "No suitable application found in Partner Center. Registered apps: $($appsResp.value.primaryName -join ', ')"
            "store_status=Skipped (No matching app in Partner Center)" >> $env:GITHUB_OUTPUT
            exit 1
          }

          Write-Host "Retrieving Application details for Product ID: $targetAppId..."
          $appUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId"
          $appObj = Invoke-RestMethod -Method Get -Uri $appUri -Headers $headers
          Write-Host "App Primary Name: $($appObj.primaryName)"
          Write-Host "Package Family Name: $($appObj.packageFamilyName)"

          # Check if there is an existing pending submission
          $createSubUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions"
          $subId = $null
          $subObj = $null
          if ($appObj.pendingApplicationSubmission -and $appObj.pendingApplicationSubmission.id) {
            $candidateSubId = $appObj.pendingApplicationSubmission.id
            Write-Host "Found existing pending submission: $candidateSubId"
            $statusUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions/$candidateSubId/status"
            try {
              $statusObj = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
              Write-Host "Existing submission status: $($statusObj.status)"
              if ($statusObj.status -eq "CommitStarted" -or $statusObj.status -eq "PreProcessing" -or $statusObj.status -eq "Certification" -or $statusObj.status -eq "Release") {
                Write-Host "Existing submission $candidateSubId is ALREADY committed and active in Partner Center (Status: $($statusObj.status))."
                Write-Host "Successfully submitted to Microsoft Store! Status: $($statusObj.status)"
                "store_status=Submitted for Certification (Status: $($statusObj.status))" >> $env:GITHUB_OUTPUT
                exit 0
              } elseif ($statusObj.status -eq "CommitFailed" -or $statusObj.status -eq "None") {
                Write-Host "Existing submission is in state '$($statusObj.status)'. Deleting and recreating fresh submission..."
                $subUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions/$candidateSubId"
                Invoke-RestMethod -Method Delete -Uri $subUri -Headers $headers
                Start-Sleep -Seconds 2
              } else {
                $subId = $candidateSubId
                $subUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions/$candidateSubId"
                $subObj = Invoke-RestMethod -Method Get -Uri $subUri -Headers $headers
              }
            } catch {
              Write-Warning "Could not query existing submission $candidateSubId status: $_"
            }
          }

          if (-not $subId) {
            Write-Host "Creating new draft submission for Product ID: $targetAppId..."
            $newSub = Invoke-RestMethod -Method Post -Uri $createSubUri -Headers $headers
            $subId = $newSub.id
            Write-Host "Created new draft submission: $subId"
            $subUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions/$subId"
            $subObj = Invoke-RestMethod -Method Get -Uri $subUri -Headers $headers
          }

          $fileUploadUrl = $subObj.fileUploadUrl
          if (-not $fileUploadUrl) {
            Write-Error "No fileUploadUrl found in submission $subId"
            "store_status=Failed (No fileUploadUrl)" >> $env:GITHUB_OUTPUT
            exit 1
          }

          # -------------------------------------------------------------------
          # Inspect and Update Store Listing Information
          # -------------------------------------------------------------------
          Write-Host "Inspecting current submission metadata..."
          Write-Host "Category: $($subObj.applicationCategory)"
          Write-Host "Pricing: isFree=$($subObj.pricing.isFree), priceId=$($subObj.pricing.priceId)"

          if (-not $subObj.applicationCategory) {
            Write-Host "Setting missing applicationCategory to UtilitiesTools..."
            $subObj.applicationCategory = "UtilitiesTools"
          }

          if (-not $subObj.pricing) {
            Write-Host "Setting missing pricing to Free..."
            $subObj.pricing = @{
              isFree = $true
              priceId = "Free"
            }
          }

          $releaseNotes = @(
            "What's New in Lunifier v${{ steps.release_info.outputs.version }}:",
            "- Unified Lunifier icon across all Windows and Linux UI dialogs, tray, and menus.",
            "- Configurable Tray Icon Double-Click Action (Channel 1, 2, 3 or open Main Window).",
            "- Global Keyboard Shortcuts (Ctrl+Alt+1, Ctrl+Alt+2, Ctrl+Alt+3) for instantaneous host channel switching.",
            "- Single-instance guard preventing duplicate background services.",
            "- Persistent Linux background service with enhanced system tray support.",
            "- Windows system Light / Dark mode dynamic auto-updating.",
            "- Polished mini dwell overlay window with Esc and click-outside dismissal."
          ) -join "`n"

          $fullDescription = @"
Lunifier coordinates Logitech Easy-Switch keyboards (MX Keys, Craft, ERGO K860, etc.) and mice (MX Master series, MX Anywhere, M720 Triathlon, POP Mouse, etc.) across screens without requiring a shared local Wi-Fi network, cloud accounts, or proprietary software running on both machines.

Key Features:
• Instant Hardware Switching: Uses direct Bluetooth/Logitech HID++ protocol commands to switch keyboard and mouse channels simultaneously.
• Dynamic Screen Border Detection: Move your mouse cursor into configurable dwell zones or double-tap the screen edge to trigger smooth switching between your computers.
• System Tray Controls & Quick Switch Flyout: Switch channels with a single click, or double-click the tray icon to switch immediately to your preferred channel.
• Global Keyboard Hotkeys: Switch instantly using customizable hotkeys (Ctrl+Alt+1, Ctrl+Alt+2, Ctrl+Alt+3).
• Automatic Windows Theme Sync: Integrates seamlessly with Windows Light and Dark display mode.
• Lightweight & Private: Zero telemetry, zero cloud dependencies, pure local control.
"@

          $shortDesc = "Seamless multi-border screen switching for Logitech Easy-Switch keyboards and mice across Windows & Linux."

          $features = @(
            "Instant Logitech Easy-Switch multi-device channel switching",
            "Multi-monitor border dwell and double-tap screen knock triggers",
            "Global keyboard hotkeys (Ctrl+Alt+1, Ctrl+Alt+2, Ctrl+Alt+3)",
            "System tray controls with customizable double-click quick actions",
            "Native Windows Light and Dark mode dynamic theme integration",
            "Zero network or cloud dependencies - 100% private and local"
          )

          $keywords = @(
            "Logitech",
            "Easy-Switch",
            "Flow",
            "MX Master",
            "MX Keys",
            "KVM",
            "Mouse",
            "Keyboard",
            "Bluetooth",
            "Bolt"
          )

          # Ensure listings exists
          if (-not $subObj.listings) {
            $subObj.listings = @{}
          }

          $hasListing = $false
          foreach ($langProp in $subObj.listings.PSObject.Properties) {
            $hasListing = $true
            $l = $langProp.Value.baseListing
            if ($l) {
              Write-Host "Updating listing for language: $($langProp.Name)"
              if (-not $l.description -or $l.description.Length -lt 20) {
                Write-Host "Populating missing description for $($langProp.Name)..."
                $l.description = $fullDescription
              }
              $l.releaseNotes = $releaseNotes
              $l.shortDescription = $shortDesc
              if (-not $l.features -or $l.features.Count -eq 0) {
                $l.features = $features
              }
              if (-not $l.keywords -or $l.keywords.Count -eq 0) {
                $l.keywords = $keywords
              }
              if (-not $l.copyrightAndTrademarkInfo) {
                $l.copyrightAndTrademarkInfo = "Copyright (c) 2026 Silviu Vlasceanu"
              }
              if (-not $l.privacyPolicyUrl) {
                $l.privacyPolicyUrl = "https://github.com/silviuk/Lunifier/blob/master/PRIVACY.md"
              }
              if (-not $l.websiteUrl) {
                $l.websiteUrl = "https://github.com/silviuk/Lunifier"
              }
              if (-not $l.supportContact) {
                $l.supportContact = "https://github.com/silviuk/Lunifier/issues"
              }
            }
          }

          if (-not $hasListing) {
            Write-Host "No listings found. Creating default 'en-us' listing..."
            $subObj.listings | Add-Member -NotePropertyName "en-us" -NotePropertyValue @{
              baseListing = @{
                description = $fullDescription
                shortDescription = $shortDesc
                features = $features
                keywords = $keywords
                releaseNotes = $releaseNotes
                copyrightAndTrademarkInfo = "Copyright (c) 2026 Silviu Vlasceanu"
                privacyPolicyUrl = "https://github.com/silviuk/Lunifier/blob/master/PRIVACY.md"
                websiteUrl = "https://github.com/silviuk/Lunifier"
                supportContact = "https://github.com/silviuk/Lunifier/issues"
              }
            } -Force
          }

          # Configure application packages
          $msixItem = Get-Item $env:MSIX_PATH
          $msixFileName = $msixItem.Name
          Write-Host "Configuring application package: $msixFileName"

          $pkgList = @()
          if ($subObj.applicationPackages) {
            foreach ($existingPkg in $subObj.applicationPackages) {
              if ($existingPkg.fileStatus -ne "PendingUpload") {
                $existingPkg.fileStatus = "PendingDelete"
                $pkgList += $existingPkg
              }
            }
          }
          $pkgList += @{
            fileName = $msixFileName
            fileStatus = "PendingUpload"
          }
          $subObj.applicationPackages = $pkgList

          Write-Host "Updating submission metadata with package information and release notes..."
          $subJson = $subObj | ConvertTo-Json -Depth 20
          $updatedSub = Invoke-RestMethod -Method Put -Uri $subUri -Headers $headers -Body $subJson
          Write-Host "Submission metadata updated successfully! Status: $($updatedSub.status)"

          # Prepare zip bundle containing the MSIX package
          Write-Host "Packaging MSIX into upload zip bundle..."
          $tempUploadDir = Join-Path $env:RUNNER_TEMP "msstore_upload_$([guid]::NewGuid().ToString('N'))"
          $bundleDir = Join-Path $tempUploadDir "bundle"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item -Path $msixItem.FullName -Destination (Join-Path $bundleDir $msixFileName)

          $zipPath = Join-Path $tempUploadDir "Upload.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $zipPath

          Write-Host "Uploading package bundle to Azure Blob Storage ($([Math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB)..."
          $httpClient = [System.Net.Http.HttpClient]::new()
          $httpClient.Timeout = [System.TimeSpan]::FromMinutes(15)
          $fileStream = [System.IO.File]::OpenRead($zipPath)
          try {
            $streamContent = [System.Net.Http.StreamContent]::new($fileStream)
            $streamContent.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse("application/zip")
            $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Put, $fileUploadUrl)
            $request.Headers.Add("x-ms-blob-type", "BlockBlob")
            $request.Content = $streamContent
            $uploadResp = $httpClient.SendAsync($request).GetAwaiter().GetResult()
            if (-not $uploadResp.IsSuccessStatusCode) {
              $respErr = $uploadResp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              Write-Error "Azure Blob upload failed with status $($uploadResp.StatusCode): $respErr"
              "store_status=Upload to Azure Blob Failed" >> $env:GITHUB_OUTPUT
              exit 1
            }
            Write-Host "Successfully uploaded MSIX bundle to Azure Blob Storage!"
          } finally {
            $fileStream.Close()
            $fileStream.Dispose()
            $httpClient.Dispose()
          }

          Write-Host "Committing submission to Partner Center for certification..."
          $commitUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions/$subId/commit"
          $commitResp = Invoke-RestMethod -Method Post -Uri $commitUri -Headers $headers
          Write-Host "Commit response: $($commitResp | ConvertTo-Json -Compress)"

          Write-Host "Polling submission status..."
          $statusUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$targetAppId/submissions/$subId/status"
          $pollCount = 0
          $finalStatus = "CommitStarted"
          do {
            Start-Sleep -Seconds 10
            try {
              $statusObj = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
              $finalStatus = $statusObj.status
              Write-Host "Submission Status: $finalStatus"
              if ($finalStatus -ne "CommitStarted") { break }
            } catch {
              Write-Warning "Transient status polling error (submission is already committed): $_"
            }
            $pollCount++
          } while ($pollCount -lt 10)

          if ($finalStatus -eq "CommitFailed") {
            Write-Error "Submission commit failed."
            "store_status=CommitFailed" >> $env:GITHUB_OUTPUT
            exit 1
          }

          Write-Host "Successfully committed to Microsoft Store! Status: $finalStatus"
          "store_status=Submitted for Certification (Status: $finalStatus)" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 4: Step Summary
      # -----------------------------------------------------------------------
      - name: Generate Workflow Summary
        if: always()
        shell: pwsh
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $version = "${{ steps.release_info.outputs.version }}"
          $wingetStatus = "${{ steps.winget.outputs.winget_status }}"
          if (-not $wingetStatus) { $wingetStatus = if ("${{ inputs.publish_winget }}" -eq "true") { "Executed" } else { "Disabled" } }
          $storeStatus = "${{ steps.msstore.outputs.store_status }}"
          if (-not $storeStatus) { $storeStatus = if ("${{ inputs.publish_store }}" -eq "true") { "Executed" } else { "Disabled" } }

          $summary = @"
          ## 🚀 Publish to Store & WinGet Summary

          - **Target Release**: `$tag` (Version: `$version`)
          - **WinGet Target**: ``silviuk.Lunifier``
          - **WinGet Status**: $wingetStatus
          - **Windows Store Status**: $storeStatus

          ---
          ### 🔑 Repository Secrets Reference
          Publication credentials configured under **Settings > Secrets and variables > Actions**:

          | Secret Name | Purpose | Status |
          |---|---|---|
          | ``WINGET_TOKEN`` | Submitting manifest PR to ``microsoft/winget-pkgs`` | Configured |
          | ``MS_STORE_TENANT_ID`` | Azure AD / Entra ID Tenant ID | Configured |
          | ``MS_STORE_SELLER_ID`` | Partner Center Publisher / Seller ID | Configured |
          | ``MS_STORE_CLIENT_ID`` | Entra ID App Registration Client ID | Configured |
          | ``MS_STORE_CLIENT_SECRET`` | Entra ID App Registration Client Secret | Configured |
          | ``MS_STORE_APP_ID`` | Microsoft Store Product ID | Auto-detected or Partner Center Product Overview |
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
