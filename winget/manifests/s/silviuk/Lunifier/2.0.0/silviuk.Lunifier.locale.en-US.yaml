ShortDescription: Seamless multi-border screen switching for Logitech Easy-Switch keyboards and mice across Windows and Linux.
Description: |
  Lunifier 2.0 Native is rewritten from scratch in native C# (.NET 9) with Windows 11 Fluent UI on Windows
  and native GTK4 + Libadwaita on Ubuntu 24.04+. Coordinates Logitech Easy-Switch keyboards and mice
  (MX Keys, MX Master series, M720 Triathlon, POP Mouse, etc.) across screens without requiring a local Wi-Fi/LAN connection.
