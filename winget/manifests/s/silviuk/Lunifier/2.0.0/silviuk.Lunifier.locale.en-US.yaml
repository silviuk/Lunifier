ReleaseNotes: |
  - Native Windows 11 Fluent GUI (.NET 9) with dark/light themes and live visual border feedback.
  - Native Ubuntu 24.04+ GTK4 + Libadwaita application adhering to GNOME 46 HIG.
  - Sub-millisecond multi-monitor geometry tracking with per-monitor border channels.
  - Configurable active border zone percentage (10% to 100%) and double-touch border knock gesture.
  - Direct Win32 SetupAPI and Linux /dev/hidraw hardware switching (<20ms execution).
  - Standalone executable size reduced to <3 MB installer and 639 KB binary.
