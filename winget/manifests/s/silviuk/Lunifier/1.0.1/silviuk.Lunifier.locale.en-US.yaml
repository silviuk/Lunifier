ReleaseNotes: |
  - Multi-Monitor Support: Configure borders, enable/disable states, and target channels per individual monitor.
  - Geometry Normalization: Supports monitors with differing resolutions, scales, and offsets.
  - Visual Border Overlay: Draws high-contrast orange active zone indicators on the selected monitor.
  - Configurable Logging: Selectable logging levels (Normal, Debug, Off) from the UI and configuration.
