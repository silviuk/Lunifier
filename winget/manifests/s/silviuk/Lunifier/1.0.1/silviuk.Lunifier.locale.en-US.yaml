ShortDescription: Seamless multi-border screen switching for Logitech Easy-Switch keyboards and mice across Windows and Linux.
Description: |
  Lunifier coordinates Logitech Easy-Switch keyboards and mice (MX Keys, MX Master 3/3S,
  M720 Triathlon, POP Mouse, etc.) across multiple screens without requiring a local Wi-Fi/LAN connection.
  Version 1.0.1 introduces per-monitor border selection and routing for multi-monitor setups
  with differing resolutions and offsets, visual active border indicators per monitor,
  and configurable logging levels (Normal, Debug, Off).
