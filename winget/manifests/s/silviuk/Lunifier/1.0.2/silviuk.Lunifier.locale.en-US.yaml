  - Fixed Linux X11 multi-threading crash (XInitThreads and dedicated thread-local display handles).
  - Expanded GUI window height and added scrollable flow configuration for complete visibility.
  - Ultra-low latency Solaar switching with persistent device alias caching and non-blocking retry.
  - Anti-bounceback Return Guard preventing cursor ping-pong loops on host re-entry.
